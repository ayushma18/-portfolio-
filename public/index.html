    <script>
      /* Apply saved preferences before first paint so there is no flash of the
         wrong theme, accent or background. This mirrors applySettings() in
         src/theme/settings.js; keep the two in step. The page stays visible
         whatever happens here — nothing is hidden waiting on script. */
      (function () {
        var d = { theme: 'auto', accent: 'rust', backdrop: 'grain', cursor: 'crosshair', motion: 'auto' };
        var s = d;
        try {
          var raw = JSON.parse(localStorage.getItem('portfolio-settings'));
          if (raw && typeof raw === 'object') {
            s = {
              theme: raw.theme || d.theme,
              accent: raw.accent || d.accent,
              backdrop: raw.backdrop || d.backdrop,
              cursor: raw.cursor || d.cursor,
              motion: raw.motion || d.motion
            };
          }
        } catch (e) {}
        var m = function (q) { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
        var el = document.documentElement;
        el.dataset.theme = s.theme === 'auto' ? (m('(prefers-color-scheme: dark)') ? 'dark' : 'light') : s.theme;
        el.dataset.motion = s.motion === 'auto' ? (m('(prefers-reduced-motion: reduce)') ? 'off' : 'full') : s.motion;
        el.dataset.accent = s.accent;
        el.dataset.backdrop = s.backdrop;
        el.dataset.cursor = s.cursor;
      })();
    </script>
